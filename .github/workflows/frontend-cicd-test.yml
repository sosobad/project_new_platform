name: Frontend CI CD Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          sep = "&" if "?" in url else "?"
          req = urllib.request.Request(
              url + sep + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " + token}
          )
          with urllib.request.urlopen(req) as response:
              jwt = json.load(response)["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "ref", "environment"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::986881030850:role/GitHubActions-MSA-Deploy
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend
        env:
          REGISTRY: 986881030850.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/frontend/Dockerfile ./msa/frontend

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name msa-platform \
            --region ap-northeast-2

      - name: Deploy Frontend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/frontend-depl \
            frontend-container=986881030850.dkr.ecr.ap-northeast-2.amazonaws.com/frontend:$IMAGE_TAG \
            -n msa

          kubectl rollout status deployment/frontend-depl \
            -n msa \
            --timeout=300s
