name: Frontend CI CD Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::986881030850:role/GitHubActions-MSA-Deploy
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend
        env:
          REGISTRY: 986881030850.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/frontend/Dockerfile ./msa/frontend

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name msa-platform \
            --region ap-northeast-2

      - name: Deploy Frontend
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/frontend-depl \
            frontend-container=986881030850.dkr.ecr.ap-northeast-2.amazonaws.com/frontend:$IMAGE_TAG \
            -n msa

          kubectl rollout status deployment/frontend-depl \
            -n msa \
            --timeout=300s
