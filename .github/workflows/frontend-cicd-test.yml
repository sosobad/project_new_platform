name: Frontend CI CD Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-eks-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::986881030850:role/GitHubActions-MSA-Deploy
          aws-region: ap-northeast-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Frontend
        env:
          REGISTRY: 986881030850.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/frontend/Dockerfile ./msa/frontend
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Save EKS access settings
        id: access
        shell: bash
        run: |
          set -euo pipefail

          aws eks describe-cluster \
            --name msa-platform \
            --region ap-northeast-2 \
            --query 'cluster.resourcesVpcConfig.publicAccessCidrs' \
            --output json > original-cidrs.json

          python3 - <<'PY'
          import json
          cidrs = json.load(open("original-cidrs.json"))
          if not cidrs:
              raise SystemExit("No existing public CIDRs")
          print("Original CIDRs:", cidrs)
          PY

          RUNNER_IP=$(curl --fail --silent --show-error https://checkip.amazonaws.com | tr -d '\r\n')
          echo "Runner IP: $RUNNER_IP"

          python3 - "$RUNNER_IP" <<'PY'
          import ipaddress, json, sys
          ip = ipaddress.ip_address(sys.argv[1])
          if ip.version != 4 or not ip.is_global:
              raise SystemExit("Runner IP is not a public IPv4 address")
          cidrs = json.load(open("original-cidrs.json"))
          cidrs.append(f"{ip}/32")
          cidrs = list(dict.fromkeys(cidrs))
          if len(cidrs) > 50:
              raise SystemExit("Too many CIDRs")
          with open("temporary-cidrs.json", "w") as f:
              json.dump({"publicAccessCidrs": cidrs}, f)
          PY

      - name: Allow GitHub Runner IP
        id: allow
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-cluster-config \
            --name msa-platform \
            --region ap-northeast-2 \
            --resources-vpc-config file://temporary-cidrs.json \
            --query 'update.id' \
            --output text > eks-update-id.txt

          aws eks wait cluster-active \
            --name msa-platform \
            --region ap-northeast-2

          echo "Runner access update completed"

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name msa-platform \
            --region ap-northeast-2

      - name: Deploy Frontend
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "=== Save current deployment image ==="

          PREVIOUS_IMAGE=$(kubectl get deployment frontend-depl \
            -n msa \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend-container")].image}')

          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "::error::Cannot determine previous image"
            exit 1
          fi

          echo "Previous image: $PREVIOUS_IMAGE"

          NEW_IMAGE="986881030850.dkr.ecr.ap-northeast-2.amazonaws.com/frontend:rollback-test-invalid"

          echo "=== Deploy new image ==="

          kubectl set image deployment/frontend-depl \
            frontend-container="$NEW_IMAGE" \
            -n msa

          echo "=== Check rollout ==="

          if kubectl rollout status deployment/frontend-depl \
            -n msa \
            --timeout=180s; then

            echo "DEPLOYMENT SUCCESS"
            exit 0
          fi

          echo "::warning::Deployment failed. Starting automatic rollback."

          echo "=== Automatic rollback ==="

          if ! kubectl set image deployment/frontend-depl \
            frontend-container="$PREVIOUS_IMAGE" \
            -n msa; then
            echo "::error::Automatic rollback command failed"
            exit 1
          fi

          if kubectl rollout status deployment/frontend-depl \
            -n msa \
            --timeout=180s; then

            RESTORED_IMAGE=$(kubectl get deployment frontend-depl \
              -n msa \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend-container")].image}')

            if [ "$RESTORED_IMAGE" = "$PREVIOUS_IMAGE" ]; then
              echo "AUTOMATIC ROLLBACK SUCCESS"
              echo "Restored image: $RESTORED_IMAGE"
              echo "::error::New deployment failed, but rollback succeeded"
            else
              echo "::error::Rollback image mismatch"
            fi
          else
            echo "::error::Automatic rollback failed"
          fi

          exit 1
      - name: Restore original EKS access
        if: ${{ always() && steps.allow.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f original-cidrs.json ]; then
            echo "Original CIDR backup missing; manual recovery required"
            exit 1
          fi

          python3 - <<'PY'
          import json
          cidrs = json.load(open("original-cidrs.json"))
          with open("restore-cidrs.json", "w") as f:
              json.dump({"publicAccessCidrs": cidrs}, f)
          PY

          aws eks wait cluster-active \
            --name msa-platform \
            --region ap-northeast-2

          aws eks update-cluster-config \
            --name msa-platform \
            --region ap-northeast-2 \
            --resources-vpc-config file://restore-cidrs.json

          aws eks wait cluster-active \
            --name msa-platform \
            --region ap-northeast-2

          echo "Original EKS public CIDRs restored"