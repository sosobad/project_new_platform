apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-depl
  namespace: msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordering 
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: ordering 
    spec:
      containers:
      - name: ordering-container
        image: 986881030850.dkr.ecr.ap-northeast-2.amazonaws.com/order-service:v20261023-dbfix
        ports:
        - containerPort: 8080
        resources:
        # 而⑦뀒?대꼫媛 ?ъ슜?좎닔 ?덈뒗 由ъ냼?ㅼ쓽 理쒕?移?          limits:
            cpu: "1"
            memory: "500Mi"
        # 而⑦뀒?대꼫媛 ?쒖옉?좊뻹 蹂댁옣諛쏆븘???섎뒗 理쒖냼 ?먯썝
          requests:
            cpu: "0.5"
            memory: "250Mi"
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_HOST
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_PW
        # 而⑦뀒?대꼫 ?곹깭 ?뺤씤 
        readinessProbe:
          httpGet:
            # healthcheck 寃쎈줈
            path: /health
            port: 8080
          # 而⑦뀒?대꼫 ?쒖옉 ??吏??          initialDelaySeconds: 10
          # ?뺤씤 諛섎났 二쇨린
          periodSeconds: 10

--- 
apiVersion: v1
kind: Service
metadata:
  name: ordering-service
  namespace: msa
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: ordering
